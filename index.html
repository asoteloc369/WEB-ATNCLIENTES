    <button class="btn btn-secondary me-2" onclick="guardarAtencion()">Guardar Atención</button>
    <button class="btn btn-success me-2" onclick="exportarExcel()">Exportar a Excel</button>
    <button class="btn btn-primary me-2" onclick="window.print()">Imprimir Ficha Técnica</button>
    <button class="btn btn-danger" onclick="exportarPDF()">Exportar a PDF</button>
  </div>
</div>

<script>
let baseDatos = [];
let contadorFolio = 1;

function guardarAtencion() {
  const inputs = document.querySelectorAll('form input, form select, form textarea');
  const fila = {};
  inputs.forEach(input => {
    if (input.name) fila[input.name] = input.value;
  });

  // Asignar folio único
  const folio = `S-${String(contadorFolio).padStart(5, '0')}`;
  fila['folio'] = folio;
  contadorFolio++;

  baseDatos.push(fila);
  document.getElementById('folioGenerado').innerText = `Atención guardada con folio: ${folio}`;

  // Limpiar campos
  inputs.forEach(input => {
    if (input.tagName === 'SELECT') {
      input.selectedIndex = 0;
    } else if (input.type !== 'button' && input.type !== 'submit' && input.type !== 'hidden') {
      input.value = '';
    }
  });
}

function exportarExcel() {
  const workbook = XLSX.utils.book_new();
  const worksheet = XLSX.utils.json_to_sheet(baseDatos);
  XLSX.utils.book_append_sheet(workbook, worksheet, 'Atenciones');
  XLSX.writeFile(workbook, 'base_datos_atenciones.xlsx');
}

function exportarPDF() {
  const doc = new window.jspdf.jsPDF();
  let y = 10;
  baseDatos.forEach((fila, index) => {
    doc.setFontSize(12);
    doc.text(`Atención ${index + 1}`, 10, y);
    y += 8;
    for (const key in fila) {
      if (fila[key]) {
        doc.text(`${key}: ${fila[key]}`, 10, y);
        y += 7;
        if (y > 270) {
          doc.addPage();
          y = 10;
        }
      }
    }
    y += 5;
  });
  doc.save("atencion_clientes_funeraria.pdf");
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  // Reparación para compatibilidad con jsPDF (versión UMD)
  window.jspdf = window.jspdf || {};
  if (!window.jspdf.jsPDF && window.jspdf.default) {
    window.jspdf.jsPDF = window.jspdf.default;
  }
</script>
